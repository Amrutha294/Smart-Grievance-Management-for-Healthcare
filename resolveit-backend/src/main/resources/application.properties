# Server
server.port=9090

# DB (use your own DB name, username, password)
spring.datasource.url=jdbc:mysql://localhost:3306/resolveitdb
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Limit the connection pool size so it never exceeds your database limit (5)
spring.datasource.hikari.maximum-pool-size=3

# Prevent connections from hanging around forever
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

